<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orb</title>
<style>
:root{color-scheme:light;--bg:#f2f2f7;--ink:#1c1c1e;--muted:#8e8e93;--line:#c6c6c8;--accent:#007aff;--picker-row:44px;--picker-height:352px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.layout{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);gap:clamp(24px,5vw,48px);padding:clamp(24px,4vh,40px) clamp(16px,3vw,32px);max-width:1040px;margin:0 auto;width:100%;align-items:center}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-width:0;overflow:visible;padding-block:8px}
.orb-wrap{width:270px;height:270px;overflow:visible}
canvas{width:100%;height:100%;display:block;overflow:visible}
.right-rail{display:flex;flex-direction:row;align-items:stretch;gap:clamp(16px,3vw,24px);align-self:center;width:100%;max-height:calc(100vh - 48px);padding-block:8px}
.state-panel{display:flex;flex-direction:column;flex:0 0 184px;min-width:0;align-self:center}
.panel-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin:0 0 10px;padding:0 6px;flex-shrink:0;text-align:center;opacity:.72}
.picker-wrap{position:relative;height:var(--picker-height);flex-shrink:0;overflow:hidden;background:transparent}
.picker-wrap::before,.picker-wrap::after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.9;z-index:3;pointer-events:none}
.picker-wrap::before{top:calc(50% - var(--picker-row) / 2)}
.picker-wrap::after{top:calc(50% + var(--picker-row) / 2)}
.picker-fade{position:absolute;left:0;right:0;height:46%;z-index:2;pointer-events:none}
.picker-fade-top{top:0;background:linear-gradient(to bottom,var(--bg) 0%,rgba(242,242,247,.95) 22%,rgba(242,242,247,.55) 48%,transparent 78%)}
.picker-fade-bottom{bottom:0;background:linear-gradient(to top,var(--bg) 0%,rgba(242,242,247,.95) 22%,rgba(242,242,247,.55) 48%,transparent 78%)}
.state-list{position:relative;z-index:1;display:flex;flex-direction:column;gap:0;margin:0;height:100%;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:calc(var(--picker-height) / 2 - var(--picker-row) / 2) 4px;outline:none}
.state-list:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.state-list::-webkit-scrollbar{display:none}
.state-opt{display:flex;align-items:center;justify-content:center;width:100%;height:var(--picker-row);padding:0 6px;border:0;background:transparent;font-size:16px;font-weight:500;letter-spacing:-.03em;color:var(--muted);cursor:pointer;flex-shrink:0;scroll-snap-align:center;-webkit-tap-highlight-color:transparent;opacity:.52;transform:scale(.94);transition:opacity .14s ease,transform .14s ease,color .14s ease,font-size .14s ease;font-variant-numeric:tabular-nums}
.state-opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.state-opt.active{opacity:1;transform:scale(1.04);font-size:17px;font-weight:700;color:var(--ink)}
.controls{display:flex;flex-direction:column;gap:22px;justify-content:center;flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.field-head label{cursor:default}
.value{font-variant-numeric:tabular-nums}
select,input[type=range]{width:100%;margin:0}
select{appearance:none;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;color:var(--ink);font:inherit;font-size:14px;outline:none;cursor:pointer}
select:focus{border-bottom-color:var(--ink)}
input[type=range]{height:24px;padding:0;background:transparent;accent-color:var(--ink);cursor:pointer}
.theme-row{display:flex;gap:4px}
.actions{display:flex;gap:4px;margin-top:4px}
.config-reset{align-self:flex-start;margin-top:8px;padding:0;border:0;background:none;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;text-align:left}
.config-reset:hover,.config-reset:focus-visible{color:var(--ink)}
button{font:inherit}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;color:var(--muted);background:none;border:0;border-radius:8px;cursor:pointer;transition:color .15s}
.icon-btn:hover,.icon-btn:focus-visible{color:var(--ink)}
.icon-btn.active{color:var(--ink)}
.icon-btn svg{width:18px;height:18px;display:block}
body.dark{color-scheme:dark;--bg:#000;--ink:#f5f5f7;--muted:#aeaeb2;--line:#48484a}
body.dark .picker-fade-top{background:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.92) 22%,rgba(0,0,0,.55) 48%,transparent 78%)}
body.dark .picker-fade-bottom{background:linear-gradient(to top,#000 0%,rgba(0,0,0,.92) 22%,rgba(0,0,0,.55) 48%,transparent 78%)}
body.dark .state-opt.active{color:#fff}
body.dark select:focus{border-bottom-color:var(--ink)}
body.dark input[type=range]{accent-color:var(--ink)}
@media(max-width:880px){.layout{grid-template-columns:1fr;max-width:420px;align-items:stretch}.stage{order:1}.right-rail{order:2;flex-direction:row;max-height:none}.state-panel{flex:0 0 168px}.orb-wrap{width:220px;height:220px}}
</style>
</head>
<body>
<main class="layout">
  <section class="stage">
    <div class="orb-wrap"><canvas id="orb" role="img" aria-label="Working"></canvas></div>
  </section>
  <div class="right-rail">
  <div class="state-panel">
    <p class="panel-label">States</p>
    <div class="picker-wrap">
      <div class="picker-fade picker-fade-top" aria-hidden="true"></div>
      <div class="picker-fade picker-fade-bottom" aria-hidden="true"></div>
      <nav class="state-list" id="stateList" aria-label="Animation states"></nav>
    </div>
  </div>
  <section class="controls">
    <div class="field">
      <div class="field-head"><label for="stateSelect">State</label></div>
      <select id="stateSelect" aria-label="Animation state"></select>
    </div>
    <div class="field">
      <div class="field-head"><label>Size</label><span class="value" id="sizeValue">270px</span></div>
      <input id="size" type="range" min="140" max="340" step="10" value="270">
    </div>
    <div class="field">
      <div class="field-head"><label>Speed</label><span class="value" id="speedValue">1.0×</span></div>
      <input id="speed" type="range" min="0.25" max="2.5" step="0.05" value="1">
    </div>
    <div class="field">
      <div class="field-head"><label>Intensity</label><span class="value" id="intensityValue">1.0×</span></div>
      <input id="intensity" type="range" min="0.5" max="1.8" step="0.1" value="1">
    </div>
    <div class="field">
      <div class="field-head"><label>Dot size</label><span class="value" id="dotSizeValue">1.0×</span></div>
      <input id="dotSize" type="range" min="0.35" max="2.5" step="0.05" value="1">
      <button type="button" class="config-reset" id="resetConfig">Reset controls</button>
    </div>
    <div class="field">
      <div class="field-head"><label>Theme</label></div>
      <div class="theme-row">
        <button type="button" class="icon-btn theme-opt active" data-theme="light" aria-label="Light theme" aria-pressed="true">
          <i data-lucide="sun"></i>
        </button>
        <button type="button" class="icon-btn theme-opt" data-theme="dark" aria-label="Dark theme" aria-pressed="false">
          <i data-lucide="moon"></i>
        </button>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="icon-btn" id="pause" aria-label="Pause">
        <i data-lucide="pause"></i>
      </button>
      <button type="button" class="icon-btn" id="restart" aria-label="Replay">
        <i data-lucide="rotate-ccw"></i>
      </button>
    </div>
  </section>
  </div>
</main>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
const canvas = document.getElementById('orb');
const ctx = canvas.getContext('2d');
const stateListEl = document.getElementById('stateList');
const stateSelectEl = document.getElementById('stateSelect');
const sizeEl = document.getElementById('size');
const speedEl = document.getElementById('speed');
const intensityEl = document.getElementById('intensity');
const dotSizeEl = document.getElementById('dotSize');
const pauseBtn = document.getElementById('pause');

const labels = {
  working: 'Working…',
  searching: 'Searching…',
  solving: 'Solving…',
  listening: 'Listening…',
  connecting: 'Connecting…',
  weaving: 'Weaving…',
  composing: 'Composing…',
  breathing: 'Breathing…',
  shaping: 'Shaping…',
  vortex: 'Vortexing…',
  exploding: 'Synthesizing Burst…',
  magnetic: 'Aligning Poles…',
  glitching: 'Recalibrating…',
  rippling: 'Broadcasting…',
  orbiting: 'Orbiting Systems…',
  crystallizing: 'Structuring Data…',
  drifting: 'Drifting…',
  focusing: 'Focusing…',
  streaming: 'Streaming…',
  sparkling: 'Sparkling…',
  tunneling: 'Tunneling…',
  melting: 'Melting…',
  pondering: 'Pondering…',
  syncing: 'Syncing…'
};

const stateIds = Object.keys(labels);
const CONFIG_STORAGE_KEY = 'thinking-orbs-config';
const LEGACY_THEME_KEY = 'thinking-orbs-theme';
const DEFAULT_CONFIG = {
  theme: 'light',
  state: 'working',
  size: 270,
  speed: 1,
  intensity: 1,
  dotSize: 1
};

let state = 'working',
    speed = 1,
    intensity = 1,
    dotSize = 1,
    paused = false,
    started = performance.now(),
    size = 270,
    theme = 'light',
    raf = 0;

// Increased dot density slightly for richer shapes
const dots = [];
for (let r = 1; r < 15; r++) {
  const lat = -Math.PI / 2 + (r * Math.PI) / 15;
  const count = Math.max(10, Math.round(42 * Math.cos(lat)));
  for (let j = 0; j < count; j++) {
    dots.push({
      lat,
      lon: (j / count) * Math.PI * 2,
      seed: Math.random() * Math.PI * 2,
      seed2: Math.random(),
      band: r,
      index: j,
      count
    });
  }
}

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function viewPad() {
  if (state === 'exploding') return 1.45;
  if (state === 'orbiting') return 1.32;
  return 1;
}

function applyViewBox() {
  const wrap = document.querySelector('.orb-wrap');
  const extent = Math.round(size * viewPad());
  wrap.style.width = extent + 'px';
  wrap.style.height = extent + 'px';
  resize();
}

function setSize(v, opts = {}) {
  size = +v;
  sizeEl.value = size;
  document.getElementById('sizeValue').textContent = size + 'px';
  applyViewBox();
  if (!opts.skipSave) saveConfig();
}

function project(p, t) {
  let x = Math.cos(p.lat) * Math.cos(p.lon);
  let y = Math.sin(p.lat);
  let z = Math.cos(p.lat) * Math.sin(p.lon);

  // Base continuous rotation
  const rotSpeed = state === 'vortex' ? 0.0012 : state === 'orbiting' ? 0.0008 : 0.00045;
  const rot = t * rotSpeed;
  let rx = x * Math.cos(rot) - z * Math.sin(rot);
  let rz = x * Math.sin(rot) + z * Math.cos(rot);
  x = rx;
  z = rz;

  let xx = x, yy = y, zz = z;
  let boost = 0; // Extra dot size & brightness boost for active zones
  const amp = intensity;

  // --- ORIGINAL 9 STATES (BOOSTED AMPLITUDE & VISIBILITY) ---
  if (state === 'working') {
    const a = t * 0.0014 + p.seed;
    const swirl = Math.sin(t * 0.001 + p.band * 0.5) * 0.24 * amp;
    xx += Math.cos(a) * swirl;
    zz += Math.sin(a) * swirl;
    yy += Math.sin(a * 1.5) * 0.08 * amp;
    boost = Math.max(0, Math.sin(a)) * 0.4;
  }

  if (state === 'searching') {
    const scan = (t * 0.0022) % (Math.PI * 2);
    const d = Math.atan2(Math.sin(p.lon - scan), Math.cos(p.lon - scan));
    const pulse = Math.exp(-d * d * 8);
    xx *= 1 + pulse * 0.34 * amp;
    zz *= 1 + pulse * 0.34 * amp;
    yy += pulse * 0.16 * amp;
    boost = pulse * 1.3;
  }

  if (state === 'solving') {
    const cycle = Math.sin(t * 0.0025);
    const chaos = Math.max(0, cycle) * 0.42 * amp;
    xx += Math.sin(t * 0.009 + p.band * 3 + p.seed) * chaos;
    yy += Math.cos(t * 0.008 + p.index + p.seed) * chaos;
    zz += Math.sin(t * 0.007 + p.seed * 2) * chaos;
    boost = chaos * 1.8;
  }

  if (state === 'listening') {
    const wave1 = Math.sin(p.lon * 4 - t * 0.0065) * 0.32;
    const wave2 = Math.cos(p.lat * 5 + t * 0.005) * 0.18;
    const total = (wave1 + wave2) * Math.cos(p.lat * 0.7) * amp;
    yy += total;
    xx *= 1 + Math.abs(total) * 0.35;
    zz *= 1 + Math.abs(total) * 0.35;
    boost = Math.abs(total) * 1.6;
  }

  if (state === 'connecting') {
    const snap = Math.sin(t * 0.003 + p.band * 0.9) > 0 ? 1 : -0.4;
    const pull = 0.16 * snap * amp;
    xx += Math.sin(p.lon * 5) * pull;
    yy += Math.cos(p.lat * 5) * pull;
    zz += Math.cos(p.lon * 5) * pull;
    boost = snap > 0 ? 0.6 : 0;
  }

  if (state === 'weaving') {
    const dir = p.band % 2 === 0 ? 1 : -1;
    const braid = Math.sin(p.lon * 3 - t * 0.004 * dir) * 0.32 * amp;
    yy += braid;
    xx += Math.cos(p.lon * 3 - t * 0.004 * dir) * 0.18 * amp;
    zz += Math.sin(p.lat * 4 + t * 0.003) * 0.15 * amp;
    boost = Math.abs(braid) * 1.2;
  }

  if (state === 'composing') {
    const sash = Math.sin(p.lat * 6 + p.lon * 3 - t * 0.0045) * 0.34 * amp;
    yy += sash;
    xx *= 1 + sash * 0.45;
    zz *= 1 + sash * 0.45;
    boost = Math.max(0, sash) * 1.8;
  }

  if (state === 'breathing') {
    const b = Math.sin(t * 0.0024);
    const breathe = 1 + 0.28 * b * amp;
    xx *= breathe;
    yy *= breathe;
    zz *= breathe;
    boost = Math.max(0, b) * 0.9;
  }

  if (state === 'shaping') {
    const morph = (Math.sin(t * 0.0018) + 1) / 2;
    const a = Math.atan2(y, x);
    const star = Math.cos(4 * a) * 0.32;
    const diamond = (Math.abs(Math.cos(a)) + Math.abs(Math.sin(a)) - 1.15) * 0.55;
    const target = ((1 - morph) * star + morph * diamond) * amp;
    const radius = 1 + target;
    xx *= radius;
    yy *= radius;
    zz *= 1 - target * 0.3;
    boost = Math.abs(target) * 1.5;
  }

  // --- NEW 7 STATES ---
  if (state === 'vortex') {
    const funnel = 0.45 + (y + 1) * 0.48; // Narrow at top/bottom, wide at other
    const twist = (1 - y) * 2.2 * Math.sin(t * 0.0015) * amp;
    const vx = xx * Math.cos(twist) - zz * Math.sin(twist);
    const vz = xx * Math.sin(twist) + zz * Math.cos(twist);
    xx = vx * funnel;
    zz = vz * funnel;
    yy += Math.sin(t * 0.005 + p.band * 0.6) * 0.12 * amp;
    boost = (1 - funnel) * 1.1;
  }

  if (state === 'exploding') {
    const cycle = (t * 0.00055) % 1;
    // Fast burst outward, smooth elastic pull back
    const burst = cycle < 0.35
      ? Math.sin((cycle / 0.35) * (Math.PI / 2))
      : Math.cos(((cycle - 0.35) / 0.65) * (Math.PI / 2));
    const scatter = 1 + burst * (0.55 + p.seed2 * 0.45) * amp;
    xx *= scatter;
    yy *= scatter;
    zz *= scatter;
    boost = burst * 1.2;
  }

  if (state === 'magnetic') {
    const field = Math.sin(p.lat * 2) * Math.sin(t * 0.0035) * 0.38 * amp;
    const pinch = 1 - Math.abs(y) * 0.35 * amp;
    xx = xx * pinch + Math.cos(p.lon) * field;
    zz = zz * pinch + Math.sin(p.lon) * field;
    yy *= 1 + Math.abs(field) * 0.45;
    boost = Math.abs(field) * 1.6;
  }

  if (state === 'glitching') {
    const step = Math.floor(t * 0.007);
    const slice = Math.sin(p.band * 1.7 + step * 3.1);
    if (slice > 0.55) {
      const shift = Math.cos(step * 7.3) * 0.38 * amp;
      xx += shift;
      zz -= shift * 0.5;
      boost = 1.1;
    }
  }

  if (state === 'rippling') {
    const wavePos = ((t * 0.0035) % 2.4) - 1.2; // Travels from -1.2 to +1.2
    const dist = Math.abs(y - wavePos);
    const ring = Math.exp(-dist * dist * 18);
    const expand = 1 + ring * 0.42 * amp;
    xx *= expand;
    zz *= expand;
    yy += (y - wavePos) * ring * 0.25 * amp;
    boost = ring * 1.6;
  }

  if (state === 'orbiting') {
    if (p.band % 3 === 0) {
      // Detach every 3rd latitude band into tilted planetary rings
      const ringR = 1.38 + (p.band % 2) * 0.16 * amp;
      const orbitAngle = p.lon + t * 0.0022 * (p.band % 2 === 0 ? 1 : -1);
      xx = Math.cos(orbitAngle) * ringR;
      zz = Math.sin(orbitAngle) * ringR;
      yy = Math.sin(orbitAngle * 2) * 0.14;
      boost = 0.75;
    } else {
      // Core shrinks slightly
      xx *= 0.72;
      yy *= 0.72;
      zz *= 0.72;
    }
  }

  if (state === 'crystallizing') {
    const morph = (Math.sin(t * 0.0022) + 1) / 2;
    // Smooth ease in/out between sphere and quantized cubic grid
    const snap = morph * morph * (3 - 2 * morph);
    const grid = 0.42;
    const gx = Math.round(xx / grid) * grid;
    const gy = Math.round(yy / grid) * grid;
    const gz = Math.round(zz / grid) * grid;
    xx = xx * (1 - snap * amp * 0.85) + gx * (snap * amp * 0.85);
    yy = yy * (1 - snap * amp * 0.85) + gy * (snap * amp * 0.85);
    zz = zz * (1 - snap * amp * 0.85) + gz * (snap * amp * 0.85);
    boost = snap * 0.9;
  }

  if (state === 'drifting') {
    const wave = Math.sin(t * 0.001 + p.seed) * 0.2 * amp;
    xx += Math.sin(p.lat * 2 + t * 0.0008) * wave;
    yy += Math.cos(p.lon + t * 0.001) * wave * 0.85;
    zz += Math.sin(p.lon * 2 - t * 0.00085) * wave;
    boost = Math.abs(wave) * 0.85;
  }

  if (state === 'focusing') {
    const pull = (Math.sin(t * 0.0028) + 1) / 2;
    const squeeze = 1 - pull * 0.38 * amp;
    xx *= squeeze;
    yy *= squeeze;
    zz *= squeeze;
    boost = pull * 1.15;
  }

  if (state === 'streaming') {
    const lane = Math.sin(p.lon * 2 - t * 0.005);
    const flow = (lane + 1) / 2;
    yy += (flow - 0.5) * 0.48 * amp;
    const pinch = Math.abs(flow - 0.5) * 0.22 * amp;
    xx *= 1 - pinch;
    zz *= 1 - pinch;
    boost = flow * 1.2;
  }

  if (state === 'sparkling') {
    const twinkle = Math.sin(t * 0.011 + p.seed * 4);
    if (twinkle > 0.55) {
      const pop = (twinkle - 0.55) * 0.6 * amp;
      xx *= 1 + pop;
      yy *= 1 + pop;
      zz *= 1 + pop;
      boost = pop * 2.1;
    }
  }

  if (state === 'tunneling') {
    const phase = Math.sin(t * 0.002);
    const open = Math.max(0, phase);
    const pinch = 1 - open * 0.22 * amp;
    const stretch = 1 + open * 0.32 * amp;
    xx *= pinch;
    yy *= pinch;
    zz *= stretch;
    boost = open * 0.95;
  }

  if (state === 'melting') {
    const heat = Math.max(0, Math.sin(t * 0.002) * 0.5 + 0.5) * amp;
    const sag = Math.max(0, y + 0.2) * heat * 0.38;
    yy -= sag;
    xx *= 1 - sag * 0.12;
    zz *= 1 - sag * 0.12;
    boost = sag * 1.35;
  }

  if (state === 'pondering') {
    const sway = Math.sin(t * 0.0011) * 0.24 * amp;
    const ripple = Math.cos(t * 0.0008 + p.band * 0.45) * sway;
    xx += ripple;
    yy += Math.sin(t * 0.0014 + p.seed) * 0.14 * amp;
    zz += ripple * 0.65;
    boost = Math.abs(ripple) * 0.65;
  }

  if (state === 'syncing') {
    const beat = Math.floor(t * 0.0042);
    const onBeat = beat % 2 === 0;
    const scale = 1 + (onBeat ? 0.14 : -0.1) * amp;
    xx *= scale;
    yy *= scale;
    zz *= scale;
    boost = onBeat ? 0.85 : 0.15;
  }

  // Camera tilt
  const tilt = 0.28;
  const y2 = yy * Math.cos(tilt) - zz * Math.sin(tilt);
  const z2 = yy * Math.sin(tilt) + zz * Math.cos(tilt);
  yy = y2;
  zz = z2;

  const perspective = 2.8 / (2.8 - zz * 0.65);
  const R = size * 0.305;

  return {
    x: xx * R * perspective,
    y: yy * R * perspective,
    z: zz,
    scale: perspective,
    boost
  };
}

function draw(t) {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;
  const time = (paused ? started : t) * speed;
  const isDark = theme === 'dark';

  const points = dots.map(p => ({ ...project(p, time), p }));

  // Sort back-to-front for crisp 3D depth occlusion
  points.sort((a, b) => a.z - b.z);

  // Subtle ambient core glow for depth
  const glow = ctx.createRadialGradient(cx, cy, size * 0.05, cx, cy, size * 0.44);
  glow.addColorStop(0, isDark ? 'rgba(245,247,250,0.06)' : 'rgba(25,29,35,0.045)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.44, 0, Math.PI * 2);
  ctx.fill();

  // State-specific vector overlays
  if (state === 'connecting' || state === 'crystallizing') {
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = isDark ? 'rgba(245,247,250,.28)' : 'rgba(30,34,40,.22)';
    const maxDist = (size * 0.14) ** 2;
    for (let i = 0; i < points.length; i += 2) {
      const a = points[i];
      if (a.z < -0.2) continue;
      for (let j = i + 1; j < Math.min(i + 18, points.length); j++) {
        const b = points[j];
        const d = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
        if (d < maxDist) {
          ctx.beginPath();
          ctx.moveTo(cx + a.x, cy + a.y);
          ctx.lineTo(cx + b.x, cy + b.y);
          ctx.stroke();
        }
      }
    }
  }

  // Render particles
  for (const q of points) {
    const front = q.z > -0.1;
    const baseAlpha = front ? 0.96 : 0.24;
    const alpha = Math.min(1, baseAlpha * (0.65 + Math.max(0, q.z) * 0.35) + q.boost * 0.25);
    const radius = (1.25 + Math.max(0, q.z) * 0.95 + q.boost * 0.85) * q.scale * dotSize;

    ctx.beginPath();
    ctx.arc(cx + q.x, cy + q.y, Math.max(0.65 * dotSize, radius), 0, Math.PI * 2);
    ctx.fillStyle = isDark
      ? `rgba(245,247,250,${alpha.toFixed(3)})`
      : `rgba(25,29,35,${alpha.toFixed(3)})`;
    ctx.fill();
  }

  if (!paused) raf = requestAnimationFrame(draw);
}

function restart() {
  started = performance.now();
  if (!paused) {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(draw);
  } else {
    draw(started);
  }
}

let pickerProgrammatic = false;
let pickerScrollTimer = 0;

function pickerCenterY() {
  return stateListEl.scrollTop + stateListEl.clientHeight / 2;
}

function scrollPickerToState(id, smooth = true) {
  const btn = stateListEl.querySelector(`[data-state="${CSS.escape(id)}"]`);
  if (!btn) return;
  pickerProgrammatic = true;
  const top = btn.offsetTop - (stateListEl.clientHeight - btn.offsetHeight) / 2;
  stateListEl.scrollTo({ top, behavior: smooth ? 'smooth' : 'auto' });
  requestAnimationFrame(() => updatePickerWheel());
  setTimeout(() => { pickerProgrammatic = false; }, smooth ? 350 : 0);
}

function updatePickerWheel({ commit = false } = {}) {
  const center = pickerCenterY();
  const span = stateListEl.clientHeight * 0.48;
  let focus = null;
  let min = Infinity;
  stateListEl.querySelectorAll('.state-opt[data-state]').forEach(btn => {
    const mid = btn.offsetTop + btn.offsetHeight / 2;
    const d = Math.abs(mid - center);
    const t = Math.min(1, d / span);
    const on = d < 22;
    const fade = 1 - t * 0.48;
    if (on) {
      btn.style.opacity = '1';
      btn.style.transform = 'scale(1.04)';
    } else {
      btn.style.opacity = String(Math.max(0.52, fade));
      btn.style.transform = `scale(${Math.max(0.9, 1 - t * 0.1)})`;
    }
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-current', on ? 'true' : 'false');
    if (d < min) {
      min = d;
      focus = btn;
    }
  });
  if (commit && focus && focus.dataset.state !== state) {
    setState(focus.dataset.state, { fromPicker: true });
  }
  return focus;
}

function setState(v, opts = {}) {
  state = v;
  canvas.setAttribute('aria-label', labels[v] || 'Thinking');
  if (stateSelectEl.value !== v) stateSelectEl.value = v;
  if (!opts.fromPicker) scrollPickerToState(v, !opts.instant);
  else updatePickerWheel();
  applyViewBox();
  restart();
  if (!opts.skipSave) saveConfig();
}

Object.keys(labels).forEach(id => {
  const label = id.charAt(0).toUpperCase() + id.slice(1);
  const opt = document.createElement('option');
  opt.value = id;
  opt.textContent = label;
  stateSelectEl.appendChild(opt);

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'state-opt';
  btn.dataset.state = id;
  btn.textContent = label;
  btn.setAttribute('role', 'option');
  btn.addEventListener('click', () => setState(id));
  stateListEl.appendChild(btn);
});

stateSelectEl.value = state;
stateSelectEl.addEventListener('change', e => setState(e.target.value));

function moveWheelState(dir) {
  const i = stateIds.indexOf(state);
  const next = stateIds[i + dir];
  if (next) setState(next);
}

function arrowControlsWheel() {
  const el = document.activeElement;
  if (!el) return true;
  const tag = el.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return false;
  if (el.isContentEditable) return false;
  return true;
}

document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  if (!arrowControlsWheel()) return;
  e.preventDefault();
  moveWheelState(e.key === 'ArrowDown' ? 1 : -1);
});

stateListEl.addEventListener('scroll', () => {
  updatePickerWheel();
  if (pickerProgrammatic) return;
  clearTimeout(pickerScrollTimer);
  pickerScrollTimer = setTimeout(() => updatePickerWheel({ commit: true }), 120);
}, { passive: true });

function clamp(n, min, max) {
  return Math.min(max, Math.max(min, n));
}

function syncConfigLabels() {
  document.getElementById('speedValue').textContent = speed.toFixed(2).replace(/0$/, '') + '×';
  document.getElementById('intensityValue').textContent = intensity.toFixed(1) + '×';
  document.getElementById('dotSizeValue').textContent = dotSize.toFixed(2).replace(/0$/, '') + '×';
}

function loadConfig() {
  const cfg = { ...DEFAULT_CONFIG };
  try {
    const raw = localStorage.getItem(CONFIG_STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p.theme === 'light' || p.theme === 'dark') cfg.theme = p.theme;
      if (typeof p.state === 'string' && labels[p.state]) cfg.state = p.state;
      if (typeof p.size === 'number') cfg.size = clamp(Math.round(p.size / 10) * 10, 140, 340);
      if (typeof p.speed === 'number') cfg.speed = clamp(p.speed, 0.25, 2.5);
      if (typeof p.intensity === 'number') cfg.intensity = clamp(p.intensity, 0.5, 1.8);
      if (typeof p.dotSize === 'number') cfg.dotSize = clamp(p.dotSize, 0.35, 2.5);
    } else {
      const legacy = localStorage.getItem(LEGACY_THEME_KEY);
      if (legacy === 'light' || legacy === 'dark') cfg.theme = legacy;
    }
  } catch (_) {}
  return cfg;
}

function saveConfig() {
  try {
    localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify({
      theme,
      state,
      size,
      speed,
      intensity,
      dotSize
    }));
  } catch (_) {}
}

function applyConfig(cfg) {
  speed = cfg.speed;
  intensity = cfg.intensity;
  dotSize = cfg.dotSize;
  speedEl.value = speed;
  intensityEl.value = intensity;
  dotSizeEl.value = dotSize;
  syncConfigLabels();
  applyTheme(cfg.theme, { redraw: false });
  setSize(cfg.size, { skipSave: true });
  setState(cfg.state, { instant: true, skipSave: true });
  saveConfig();
}

function resetConfig() {
  speed = DEFAULT_CONFIG.speed;
  intensity = DEFAULT_CONFIG.intensity;
  dotSize = DEFAULT_CONFIG.dotSize;
  speedEl.value = speed;
  intensityEl.value = intensity;
  dotSizeEl.value = dotSize;
  syncConfigLabels();
  setSize(DEFAULT_CONFIG.size);
  saveConfig();
}

sizeEl.addEventListener('input', e => setSize(e.target.value));
speedEl.addEventListener('input', e => {
  speed = +e.target.value;
  syncConfigLabels();
  saveConfig();
});
intensityEl.addEventListener('input', e => {
  intensity = +e.target.value;
  syncConfigLabels();
  saveConfig();
});
dotSizeEl.addEventListener('input', e => {
  dotSize = +e.target.value;
  syncConfigLabels();
  if (paused) draw(started);
  saveConfig();
});

function applyTheme(t, { persist = false, redraw = false } = {}) {
  theme = t === 'dark' ? 'dark' : 'light';
  document.body.classList.toggle('dark', theme === 'dark');
  document.querySelectorAll('.theme-opt[data-theme]').forEach(x => {
    const on = x.dataset.theme === theme;
    x.classList.toggle('active', on);
    x.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  if (persist) saveConfig();
  if (redraw) restart();
}

function refreshIcons(root) {
  if (typeof lucide === 'undefined') return;
  lucide.createIcons(root ? { root } : undefined);
}

function updatePauseIcon() {
  const name = paused ? 'play' : 'pause';
  pauseBtn.setAttribute('aria-label', paused ? 'Play' : 'Pause');
  pauseBtn.innerHTML = `<i data-lucide="${name}"></i>`;
  refreshIcons(pauseBtn);
}

document.querySelectorAll('.theme-opt[data-theme]').forEach(b =>
  b.addEventListener('click', () => applyTheme(b.dataset.theme, { persist: true, redraw: true }))
);

pauseBtn.addEventListener('click', () => {
  paused = !paused;
  updatePauseIcon();
  if (!paused) {
    started = performance.now();
    raf = requestAnimationFrame(draw);
  } else {
    cancelAnimationFrame(raf);
  }
});

document.getElementById('restart').addEventListener('click', () => {
  if (paused) {
    paused = false;
    updatePauseIcon();
  }
  restart();
});

document.getElementById('resetConfig').addEventListener('click', resetConfig);

applyConfig(loadConfig());
raf = requestAnimationFrame(draw);
refreshIcons();
</script>
</body>
</html>
